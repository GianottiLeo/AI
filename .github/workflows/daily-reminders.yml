name: Daily Reminders

on:
  schedule:
    - cron: '30 12 * * *'  # 9:30 AM BRT (UTC-3)
  workflow_dispatch:  # Manual trigger

jobs:
  check-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check reminders and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          echo "Checking reminders for $TODAY"
          
          REMINDERS=$(grep "$TODAY" reminders/README.md | grep -v "^#" || true)
          
          if [ -n "$REMINDERS" ]; then
            echo "Found reminders for today:"
            echo "$REMINDERS"
            
            # Send Telegram notification
            MESSAGE="📅 Reminders for today:%0A%0A$REMINDERS"
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              -d text="$MESSAGE"
            
            echo "Telegram notification sent!"
          else
            echo "No reminders for today"
          fi

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        if: success()
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "📅 Second Memory - Reminders for today"
          to: ${{ secrets.EMAIL_TO }}
          from: Second Memory <${{ secrets.EMAIL_USERNAME }}>
          body: |
            Your reminders for today:
            
            Check your repo: https://github.com/GianottiLeo/AI/blob/main/reminders/README.md
