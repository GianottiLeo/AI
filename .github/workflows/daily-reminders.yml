name: Daily Reminders

on:
  schedule:
    - cron: '30 12 * * *'  # 9:30 AM BRT (UTC-3)
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write  # This fixes the 403 error

jobs:
  check-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check reminders and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          echo "Checking reminders for $TODAY"
          
          # Read reminders file and find today's items
          REMINDERS=$(grep "$TODAY" reminders/README.md | grep -v "^#" || true)
          
          if [ -n "$REMINDERS" ]; then
            echo "Found reminders for today:"
            echo "$REMINDERS"
            
            # Send Telegram notification
            MESSAGE="📅 *Reminders for today:*%0A%0A$REMINDERS"
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              -d text="$MESSAGE" \
              -d parse_mode="Markdown"
          else
            echo "No reminders for today"
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Update reminders $(date +%Y-%m-%d)"
          git push
